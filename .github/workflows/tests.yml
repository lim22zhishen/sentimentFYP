name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # The runner has no GPU. Installing the CPU-only torch first means
      # requirements.txt finds torch already satisfied and doesn't pull the
      # multi-GB CUDA build.
      - name: Install CPU-only PyTorch
        run: pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      # Models are stubbed in the tests, so nothing is downloaded from HuggingFace.
      - name: Run tests
        run: pytest -rs
